<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
  <title>PiKachu cổ điển</title>
  <style>
    .cell {
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      box-sizing: border-box;
      background-position: center;
      background-repeat: no-repeat;
      background-size: contain;
      border: 1px solid #ccc;
      border-radius: 6px;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
    }

    .cell:hover {
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.25);
    }

    .cell::-moz-focus-inner {
      border: 0;
    }

    .cell.active {
      transform: scale(0.95);
      box-shadow: 0 0 6px rgba(0, 0, 0, 0.4);
      border-color: red;
      z-index: 2;
    }

    /* Ô đã ăn: ẩn đi nhưng vẫn giữ chỗ trong lưới */
    .cell.matched {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes glow {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(255, 215, 0, 0);
      }

      50% {
        box-shadow: 0 0 10px 4px rgba(255, 215, 0, 0.9);
      }
    }

    .cell.hint {
      animation: glow 0.8s ease-in-out infinite;
    }

    .cell.empty {
      pointer-events: none;
      cursor: default;
    }

    .seg {
      position: absolute;
      background: #FF9900;
      pointer-events: none;
    }

    .border-cell {
      background: transparent;
      border: none;
      pointer-events: none;
    }

    .seg.up {
      left: 50%;
      top: -2px;
      width: 2px;
      height: calc(50% + 2px);
      transform: translateX(-50%);
    }

    .seg.down {
      left: 50%;
      bottom: -2px;
      width: 2px;
      height: calc(50% + 2px);
      transform: translateX(-50%);
    }

    .seg.left {
      top: 50%;
      left: -2px;
      height: 2px;
      width: calc(50% + 2px);
      transform: translateY(-50%);
    }

    .seg.right {
      top: 50%;
      right: -2px;
      height: 2px;
      width: calc(50% + 2px);
      transform: translateY(-50%);
    }

    #banner {
      background-image: url(./Resources/bg1.jpg);
      min-height: 100vh;
      background-size: cover;
      background-repeat: no-repeat
    }

    .laser {
      position: relative;
      z-index: 1;
      background-color: rgba(255, 40, 40, 0.35);
      outline: 3px solid #ff2d2d;
      outline-offset: -3px;
      box-shadow:
        0 0 12px 2px rgba(255, 45, 45, 0.9),
        inset 0 0 14px rgba(255, 255, 255, 0.6);
      animation: laser-pulse 0.4s ease-in-out infinite alternate;
    }

    @keyframes laser-pulse {
      from {
        background-color: rgba(255, 40, 40, 0.20);
      }

      to {
        background-color: rgba(255, 40, 40, 0.55);
      }
    }

    /* NPC Boss */
    .stage {
      max-width: 420px;
      height: 300px;
    }

    .ground {
      height: 50px;
      background: #1d1627;
    }

    /* Boss thở */
    .boss {
      width: 192px;
      height: 192px;
      transform-origin: 50% 100%;
      transform: scale(2.5);
      animation: breathe 2.2s ease-in-out infinite;
    }

    /* Khi boss tấn công thì dừng animation thở */
    .boss.attack {
      animation: none;
    }

    .sprite {
      width: 192px;
      height: 192px;
      background: url(Resources/boss_sheet.png) 0 0 no-repeat;
      image-rendering: pixelated;
    }

    /* Animation tấn công */
    .sprite.attack {
      animation: atk .8s steps(4) forwards;
    }

    /* Animation bị đánh */
    .sprite.hit {
      animation: hit .35s;
    }

    /* Stage rung khi boss tấn công */
    .stage.attack {
      animation: shake .3s .4s;
    }

    /* Có thể dùng cho bất kỳ element nào */
    .shake {
      animation: shake .3s;
    }

    /* Boss thở */
    @keyframes breathe {
      50% {
        transform: translateY(-6px) scale(2.5, 2.545);
      }
    }

    /* Sprite tấn công */
    @keyframes atk {
      from {
        background-position-x: -768px;
      }

      to {
        background-position-x: -1536px;
      }
    }

    /* Boss bị đánh */
    @keyframes hit {
      0% {
        filter: brightness(3);
      }

      30% {
        transform: translateX(-16px);
        filter: brightness(2);
      }

      100% {
        transform: none;
        filter: none;
      }
    }

    /* Rung */
    @keyframes shake {

      0%,
      100% {
        transform: none;
      }

      25% {
        transform: translate(-6px, 4px);
      }

      50% {
        transform: translate(6px, -3px);
      }

      75% {
        transform: translate(-3px, 2px);
      }
    }

    .bonus {
      transition: ease-in 5s ease-out 5s;
    }
  </style>
</head>
